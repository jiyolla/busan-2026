  document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]').forEach(function(n){n.remove();});
  var i2=document.createElement('link'); i2.rel='icon'; i2.type='image/svg+xml'; i2.href='favicon.svg'+stamp;

}
